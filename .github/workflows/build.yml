name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags: the version is taken from git describe
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libhamlib-dev portaudio19-dev libfftw3-dev \
            libsamplerate0-dev libsndfile1-dev libsqlite3-dev libcurl4-openssl-dev libcodec2-dev libpulse-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  test-macos:
    name: Build and test (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 runs on every trigger; x86_64 only on a manual run
        # (Actions tab -> build -> Run workflow, or `gh workflow run build`).
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '[{"arch":"arm64","runner":"macos-15"},{"arch":"x86_64","runner":"macos-13"}]'
          || '[{"arch":"arm64","runner":"macos-15"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags: the version is taken from git describe
      - name: Install dependencies
        run: |
          brew update
          # sqlite3 and libcurl come from the macOS SDK.
          brew install ninja pkg-config gtk4 libadwaita hamlib portaudio \
            fftw libsamplerate libsndfile codec2
      - name: Toolchain diagnostics
        run: |
          pkg-config --modversion gtk4 libadwaita-1 hamlib portaudio-2.0 fftw3f samplerate sndfile sqlite3
          cmake --version | head -1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test the CLI
        run: |
          ./build/src/cli/gtty-cli encode "CQ CQ DE N0CALL K" /tmp/cq.wav
          ./build/src/cli/gtty-cli decode /tmp/cq.wav | tee /tmp/decoded.txt
          grep -q "CQ CQ DE N0CALL K" /tmp/decoded.txt
          ./build/src/cli/gtty-cli rigs "ft-710" | head -2

  deb:
    name: Package (${{ matrix.distro.tag }} ${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { image: "debian:trixie", tag: debian13 }
          - { image: "ubuntu:24.04", tag: ubuntu24.04 }
          - { image: "ubuntu:25.04", tag: ubuntu25.04 }
          - { image: "ubuntu:25.10", tag: ubuntu25.10 }
        arch:
          - { name: amd64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
    container: ${{ matrix.distro.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags: the version is taken from git describe
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config file \
            dpkg-dev libgtk-4-dev libadwaita-1-dev libhamlib-dev portaudio19-dev libfftw3-dev \
            libsamplerate0-dev libsndfile1-dev libsqlite3-dev libcurl4-openssl-dev libcodec2-dev libpulse-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGTTY_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
      - name: Package
        run: |
          cd build && cpack -G DEB
          # one asset name per distro: gtty_<version>_<distro>_<arch>.deb
          for f in gtty_*.deb; do mv "$f" "${f%_*}_${{ matrix.distro.tag }}_${f##*_}"; done
          ls -l *.deb
      - name: Lint package
        run: |
          apt-get install -y --no-install-recommends lintian || true
          lintian --no-tag-display-limit build/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: gtty-deb-${{ matrix.distro.tag }}-${{ matrix.arch.name }}
          path: build/*.deb

  riscv64:
    name: Build, test and package (debian13 riscv64, emulated)
    # GitHub has no riscv64 runners: the build runs in a riscv64 container under QEMU
    # user emulation, several times slower than the native jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags: the version is taken from git describe
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Build, test and package in a riscv64 container
        run: |
          docker run --rm --platform linux/riscv64 \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/src" -w /src debian:trixie bash -euxc '
              uname -m
              apt-get update
              apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config file git \
                dpkg-dev libgtk-4-dev libadwaita-1-dev libhamlib-dev portaudio19-dev libfftw3-dev \
                libsamplerate0-dev libsndfile1-dev libsqlite3-dev libcurl4-openssl-dev libcodec2-dev libpulse-dev
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build build
              file build/src/cli/gtty-cli | grep -q "RISC-V"
              # emulation is slow: give each test more than the default time
              ctest --test-dir build --output-on-failure --timeout 600
              ./build/src/cli/gtty-cli encode "CQ CQ DE N0CALL K" /tmp/cq.wav
              ./build/src/cli/gtty-cli decode /tmp/cq.wav | tee /tmp/decoded.txt
              grep -q "CQ CQ DE N0CALL K" /tmp/decoded.txt
              cd build && cpack -G DEB
              for f in gtty_*.deb; do mv "$f" "${f%_*}_debian13_${f##*_}"; done
              ls -l *.deb
            '
      - uses: actions/upload-artifact@v4
        with:
          name: gtty-deb-debian13-riscv64
          path: build/*.deb

  appimage:
    name: AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags: the version is taken from git describe
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev portaudio19-dev libfftw3-dev libsamplerate0-dev \
            libsndfile1-dev libsqlite3-dev libcurl4-openssl-dev libcodec2-dev libpulse-dev libusb-1.0-0-dev curl file libgdk-pixbuf2.0-dev \
            libglib2.0-dev-bin librsvg2-common adwaita-icon-theme
      - name: Install optional runtime extras for bundling
        run: |
          for p in fuse libfuse2t64 libfuse2 adwaita-icon-theme librsvg2-common gstreamer1.0-gtk4 \
                   gstreamer1.0-plugins-base gstreamer1.0-plugins-good libgstreamer-gl1.0-0; do
            sudo apt-get install -y --no-install-recommends "$p" || echo "skipping $p"
          done
      - name: Build Hamlib 4.6.2 (newer than the distro package; adds recent rigs)
        run: |
          curl -fsSL -o hamlib.tar.gz https://github.com/Hamlib/Hamlib/releases/download/4.6.2/hamlib-4.6.2.tar.gz
          mkdir hamlib && tar -xzf hamlib.tar.gz -C hamlib --strip-components=1
          cd hamlib && ./configure --prefix=/usr --without-cxx-binding --disable-static && make -j"$(nproc)" && sudo make install
          sudo ldconfig
      - name: Toolchain diagnostics
        run: |
          pkg-config --modversion gtk4 libadwaita-1 hamlib portaudio-2.0 fftw3f samplerate sndfile sqlite3
          cmake --version | head -1
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGTTY_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - name: Smoke test the AppImage (CLI inside the bundle)
        run: |
          chmod +x gtty-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./gtty-*.AppImage --appimage-extract >/dev/null
          ./squashfs-root/usr/bin/gtty-cli rigs "ft-710" | head -2
          ls squashfs-root/usr/lib | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: gtty-appimage-${{ matrix.arch }}
          path: gtty-*.AppImage

  appimage-riscv64:
    name: AppImage (riscv64, emulated)
    # No riscv64 runners, and no riscv64 release of linuxdeploy or the AppImage runtime:
    # the build runs in a riscv64 ubuntu:24.04 container (the base the other AppImages are
    # built on) under QEMU user emulation, and build-appimage.sh bundles the libraries itself.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags: the version is taken from git describe
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Cache the Hamlib 4.6.2 build (slow under emulation)
        uses: actions/cache@v4
        with:
          path: hamlib-riscv64
          key: hamlib-4.6.2-riscv64-ubuntu24.04-v1
      - name: Build and smoke test the AppImage in a riscv64 container
        run: |
          docker run --rm --platform linux/riscv64 \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/src" -w /src ubuntu:24.04 bash -euxc '
              uname -m
              apt-get update
              apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
                ca-certificates curl file git patchelf squashfs-tools \
                libgtk-4-dev libadwaita-1-dev portaudio19-dev libfftw3-dev libsamplerate0-dev \
                libsndfile1-dev libsqlite3-dev libcurl4-openssl-dev libcodec2-dev libpulse-dev libusb-1.0-0-dev \
                libgdk-pixbuf2.0-dev libglib2.0-dev-bin librsvg2-common adwaita-icon-theme
              # Hamlib 4.6.2 (newer than the distro package; adds recent rigs), as in the other AppImages
              if [ ! -d hamlib-riscv64/usr ]; then
                curl -fsSL -o hamlib.tar.gz https://github.com/Hamlib/Hamlib/releases/download/4.6.2/hamlib-4.6.2.tar.gz
                mkdir hamlib && tar -xzf hamlib.tar.gz -C hamlib --strip-components=1
                (cd hamlib && ./configure --prefix=/usr --without-cxx-binding --disable-static \
                  && make -j"$(nproc)" && make install DESTDIR=/src/hamlib-riscv64)
              fi
              cp -a hamlib-riscv64/. /
              ldconfig
              pkg-config --modversion gtk4 libadwaita-1 hamlib portaudio-2.0 fftw3f samplerate sndfile sqlite3
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGTTY_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build build
              ./packaging/build-appimage.sh
              # smoke test: the CLI inside the bundle, running against the bundled libraries
              file gtty-riscv64.AppImage | grep -q "RISC-V"
              # The AppImage cannot be executed here: its "AI" magic sits in the ELF header
              # padding (bytes 8-10), which the qemu-user binfmt_misc rule requires to be
              # zero, so the kernel answers "Exec format error". Unpack the SquashFS image
              # appended to the runtime instead.
              unsquashfs -q -n -o "$(stat -c %s packaging/tools/uruntime-*-riscv64)" \
                -d squashfs-root gtty-riscv64.AppImage
              ldd squashfs-root/usr/bin/gtty | grep "squashfs-root/usr/lib/libgtk-4"
              ldd squashfs-root/usr/bin/gtty-cli | grep "squashfs-root/usr/lib/libhamlib"
              ./squashfs-root/usr/bin/gtty-cli rigs "ft-710" | head -2
              ./squashfs-root/usr/bin/gtty-cli encode "CQ CQ DE N0CALL K" /tmp/cq.wav
              ./squashfs-root/usr/bin/gtty-cli decode /tmp/cq.wav | tee /tmp/decoded.txt
              grep -q "CQ CQ DE N0CALL K" /tmp/decoded.txt
              ls squashfs-root/usr/lib | head -40
              rm -rf squashfs-root
            '
      - uses: actions/upload-artifact@v4
        with:
          name: gtty-appimage-riscv64
          path: gtty-*.AppImage

  macos-app:
    name: macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags: the version is taken from git describe
      - name: Install dependencies
        run: |
          brew update
          # sqlite3 and libcurl come from the macOS SDK.
          brew install ninja pkg-config gtk4 libadwaita hamlib portaudio \
            fftw libsamplerate libsndfile codec2 \
            dylibbundler librsvg adwaita-icon-theme
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGTTY_BUILD_TESTS=OFF
          cmake --build build
      - name: Build gtty.app and the disk image
        run: ./packaging/build-macos-app.sh
      - name: Smoke test the bundle (CLI inside the mounted disk image)
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/gtty-dmg gtty-*.dmg
          ls /tmp/gtty-dmg/gtty.app/Contents/Frameworks | head -60
          cli=/tmp/gtty-dmg/gtty.app/Contents/MacOS/gtty-cli
          "$cli" encode "CQ CQ DE N0CALL K" /tmp/cq.wav
          "$cli" decode /tmp/cq.wav | tee /tmp/decoded.txt
          grep -q "CQ CQ DE N0CALL K" /tmp/decoded.txt
          "$cli" rigs "ft-710" | head -2
          hdiutil detach /tmp/gtty-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: gtty-macos-${{ matrix.arch }}
          path: gtty-*.dmg

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, deb, riscv64, appimage, appimage-riscv64, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gtty-deb-*/*.deb
            dist/gtty-appimage-*/*.AppImage
            dist/gtty-macos-*/*.dmg
          generate_release_notes: true
